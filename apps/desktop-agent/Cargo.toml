[package]
name = "remotehask-agent"
version = "0.1.0"
edition = "2021"
description = "remoteHask desktop agent"
license = "UNLICENSED"
publish = false

[[bin]]
name = "remotehask-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
